name: cross-provider-fixup-helper

on:
  push:
    branches:
      - fix/cross-provider-subagents
    paths:
      - .github/workflows/cross-provider-fixup-helper.yml

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/cross-provider-subagents
      - name: Restore current-main API changes around the provider patch
        shell: python
        run: |
          from pathlib import Path

          config = Path('codex-rs/core/src/config/mod.rs')
          text = config.read_text()
          old = '''#[cfg(test)]
          mod schema;
          mod subagent_model_provider;
          '''
          new = '''#[cfg(test)]
          mod schema;
          mod subagent_model_provider;
          mod token_budget_startup;
          '''
          assert old in text, 'config module anchor changed'
          text = text.replace(old, new, 1)
          old = 'pub(crate) use subagent_model_provider::SubagentModelProviderBaseline;\n'
          new = old + 'pub use token_budget_startup::TokenBudgetStartupConfig;\n'
          assert old in text, 'config export anchor changed'
          config.write_text(text.replace(old, new, 1))

          parallel = Path('codex-rs/core/src/tools/parallel.rs')
          text = parallel.read_text()
          old = '        let future = self.handle_tool_call_with_source(call, source, cancellation_token);\n'
          new = '''        let step_context = Arc::clone(&self.step_context);
          let future =
              self.handle_tool_call_with_source(step_context, call, source, cancellation_token);
          '''
          assert old in text, 'parallel call anchor changed'
          parallel.write_text(text.replace(old, new, 1))
      - name: Format and push
        shell: bash
        run: |
          set -euxo pipefail
          cd codex-rs
          cargo fmt --all
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/core/src/config/mod.rs codex-rs/core/src/tools/parallel.rs
          git commit -m "fix(core): preserve current main config and tool runtime APIs"
          git push origin HEAD:fix/cross-provider-subagents
