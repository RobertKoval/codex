name: cross-provider-test-audit-fixup

on:
  push:
    branches:
      - fix/cross-provider-subagents
    paths:
      - .github/workflows/cross-provider-test-audit-fixup.yml

permissions:
  contents: write

jobs:
  restore-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/cross-provider-subagents
      - name: Restore current-main thread manager regression tests
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          path = "codex-rs/core/src/thread_manager_tests.rs"
          subprocess.run(
              ["git", "fetch", "origin", "main:refs/remotes/origin/main"],
              check=True,
          )
          main = subprocess.check_output(
              ["git", "show", f"origin/main:{path}"],
              text=True,
          )
          current = Path(path).read_text()
          anchor = 'const TEST_INSTALLATION_ID: &str = "11111111-1111-4111-8111-111111111111";\n\n'
          marker = "/// Controls without a custom allocation policy still produce distinct thread identifiers."
          assert anchor in main and marker in main, "upstream test anchors changed"
          upstream_block = main.split(anchor, 1)[1].split(marker, 1)[0]
          assert "live_fork_keeps_instructions_when_source_is_unloaded_during_setup" in upstream_block
          assert "thread_analytics_opt_out_overrides_shared_client" in upstream_block
          assert "live_fork_keeps_instructions_when_source_is_unloaded_during_setup" not in current
          assert anchor in current, "feature branch anchor changed"
          Path(path).write_text(current.replace(anchor, anchor + upstream_block, 1))
      - name: Format and push
        shell: bash
        run: |
          set -euxo pipefail
          cd codex-rs
          cargo fmt --all
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/core/src/thread_manager_tests.rs
          git commit -m "test(core): preserve current main thread manager regressions"
          git push origin HEAD:fix/cross-provider-subagents
